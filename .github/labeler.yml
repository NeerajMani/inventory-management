# Auto-labeling configuration for PRs

frontend:
  - changed-files:
    - any-glob-to-any-file: 'client/**/*'

backend:
  - changed-files:
    - any-glob-to-any-file: 'server/**/*'

tests:
  - changed-files:
    - any-glob-to-any-file: 'tests/**/*'

documentation:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*.md'
      - 'docs/**/*'

ci/cd:
  - changed-files:
    - any-glob-to-any-file: '.github/**/*'

dependencies:
  - changed-files:
    - any-glob-to-any-file:
      - 'client/package*.json'
      - 'server/requirements.txt'
      - 'server/pyproject.toml'

ui/ux:
  - changed-files:
    - any-glob-to-any-file:
      - 'client/**/*.vue'
      - 'client/**/*.css'
